<!doctype html>
<!--
  Vox archival style, test scene 01: "One press. Scripture for the people."
  1920x1080, 10s, 30fps. Paper collage, stamped date, line-drawn press, a counter,
  a hand-drawn marker with a note, one pan across the board, a map of presses spreading from Mainz.
  No network, no randomness, no clock: every frame is a pure function of the timeline.
-->
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=1920, height=1080">
<script src="assets/gsap.min.js"></script>
<style>
@font-face{font-family:'Serif';src:url(assets/Fraunces.ttf) format('truetype');}
@font-face{font-family:'Sans';src:url(assets/Helvetica-Bold.ttf) format('truetype');}
@font-face{font-family:'Mono';src:url(assets/Mono.ttf) format('truetype');}
:root{--paper:#EFE5CF;--ink:#1E1A16;--brown:#6B5A45;--red:#B3261E;--cream:#FFF7DE}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:var(--paper)}
#root{position:relative;width:1920px;height:1080px;overflow:hidden;background:var(--paper)}
#board{position:absolute;left:0;top:0;width:3840px;height:1080px;transform-origin:50% 50%}
.paper{position:absolute;inset:0;background:
  radial-gradient(ellipse at 30% 40%,rgba(255,250,235,.55),transparent 60%),
  radial-gradient(ellipse at 75% 70%,rgba(160,130,90,.18),transparent 55%),var(--paper)}
.grain{position:absolute;inset:0;opacity:.38;mix-blend-mode:multiply}
.vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 50%,transparent 55%,rgba(60,40,20,.38) 100%)}

/* left half: Mainz */
.stamp{position:absolute;left:150px;top:120px;padding:14px 26px;border:5px solid var(--red);color:var(--red);
  font:700 44px 'Mono';letter-spacing:6px;transform:rotate(-6deg);opacity:0;mix-blend-mode:multiply}
.stamp::after{content:"";position:absolute;inset:4px;border:2px solid var(--red)}
.head{position:absolute;left:150px;top:250px;font:600 150px/1 'Serif';color:var(--ink);letter-spacing:-3px}
.head span{display:inline-block;opacity:0}
.sub{position:absolute;left:156px;top:420px;font:400 30px 'Mono';color:var(--brown);letter-spacing:3px;opacity:0}
.pressCard{position:absolute;left:1060px;top:110px;width:680px;height:640px;background:var(--cream);
  box-shadow:0 18px 40px rgba(50,30,10,.28);transform:rotate(2.5deg);opacity:0;
  clip-path:polygon(0 2%,6% 0,14% 1.5%,25% 0,38% 1%,52% 0,66% 1.6%,80% 0,92% 1.2%,100% 0,99% 20%,100% 45%,98.8% 70%,100% 100%,85% 98.6%,70% 100%,55% 98.8%,40% 100%,25% 98.5%,10% 100%,0 98%,1% 70%,0 45%,1.2% 20%)}
.pressCard svg{position:absolute;inset:40px 60px 90px}
.pressCard .cap{position:absolute;left:0;right:0;bottom:30px;text-align:center;font:400 22px 'Mono';letter-spacing:4px;color:var(--brown)}
.tape{position:absolute;width:150px;height:44px;background:rgba(230,215,170,.75);box-shadow:0 2px 4px rgba(0,0,0,.08)}
.bible{position:absolute;left:150px;top:560px;width:820px;opacity:0}
.bible .t{font:600 78px/1.05 'Serif';color:var(--ink)}
.bible .t .kw{position:relative;display:inline-block}
.bible .n{margin-top:22px;font:700 120px/1 'Sans';color:var(--red);letter-spacing:-2px}
.bible .n small{font:400 34px 'Mono';color:var(--brown);letter-spacing:3px;margin-left:16px}
#mark{position:absolute;left:-14px;top:-6px;overflow:visible}
#conn{position:absolute;overflow:visible}
.note{position:absolute;left:720px;top:478px;font:700 24px 'Mono';letter-spacing:3px;color:var(--red);opacity:0;white-space:nowrap}

/* right half: the spread */
.head2{position:absolute;left:2010px;top:200px;width:600px;font:600 104px/1 'Serif';color:var(--ink);letter-spacing:-2px}
.head2 span{display:inline-block;opacity:0}
.year{position:absolute;left:2016px;top:560px;font:700 140px/1 'Sans';color:var(--red);letter-spacing:-3px;opacity:0}
.yearlbl{position:absolute;left:2020px;top:710px;font:400 28px 'Mono';letter-spacing:4px;color:var(--brown);opacity:0}
#map{position:absolute;left:0;top:0;width:3840px;height:1080px;overflow:visible}
.city{font:400 19px 'Mono';fill:var(--ink);letter-spacing:1.5px}
.city.big{font:700 24px 'Mono';fill:var(--red)}
</style></head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="10" data-width="1920" data-height="1080" data-fps="30">
 <div id="board" class="clip" data-start="0" data-duration="10" data-track-index="0">
  <div class="paper"></div>
  <svg class="grain" width="3840" height="1080"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="4" seed="7"/><feColorMatrix values="0 0 0 0 .35  0 0 0 0 .27  0 0 0 0 .18  0 0 0 .9 0"/></filter><rect width="3840" height="1080" filter="url(#n)"/></svg>

  <div class="stamp" id="stamp">MAINZ · c.1455</div>
  <div class="head" id="head"><span>One</span> <span>press.</span></div>
  <div class="sub" id="sub">JOHANNES GUTENBERG · MOVABLE TYPE</div>

  <div class="pressCard" id="pressCard">
   <svg viewBox="0 0 560 470" fill="none" stroke="#1E1A16" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path class="draw" d="M90 455 V40 M470 455 V40"/>
    <path class="draw" d="M60 40 H500 M60 70 H500"/>
    <path class="draw" d="M60 455 H500"/>
    <path class="draw" d="M280 70 V150 M262 80 L298 92 M262 98 L298 110 M262 116 L298 128 M262 134 L298 146"/>
    <path class="draw" d="M280 150 L455 120 M455 120 a10 10 0 1 0 0.1 0"/>
    <path class="draw" d="M190 160 H370 V190 H190 Z"/>
    <path class="draw" d="M120 300 H440 V330 H120 Z"/>
    <path class="draw" d="M150 300 V255 H410 V300"/>
    <path class="draw" d="M90 380 H470 M120 330 L110 455 M440 330 L450 455"/>
    <path class="draw" stroke-width="3" d="M175 270 H385 M175 284 H385"/>
   </svg>
   <div class="tape" style="left:-40px;top:-6px;transform:rotate(-28deg)"></div>
   <div class="tape" style="right:-40px;top:-2px;transform:rotate(24deg)"></div>
   <div class="cap">FIG. 1 · THE SCREW PRESS</div>
  </div>

  <div class="bible" id="bible">
   <div class="t">The first printed <span class="kw" id="kw">Bible<svg id="mark" width="290" height="110"><path id="markp" d="M20 62 C 60 8, 210 4, 262 40 C 300 70, 230 104, 130 100 C 40 96, 2 74, 26 44 C 44 22, 110 12, 170 14" stroke="#B3261E" stroke-width="5" fill="none" stroke-linecap="round"/></svg></span></div>
   <div class="n">≈<span id="count">0</span><small>COPIES</small></div>
  </div>
  <svg id="conn" width="1920" height="1080" style="left:0;top:0"><path id="connp" d="M690 590 C 720 560, 740 530, 760 512" stroke="#B3261E" stroke-width="3" fill="none" stroke-dasharray="0" stroke-linecap="round"/></svg>
  <div class="note" id="note">SCRIPTURE, IN EVERY HAND</div>

  <div class="head2" id="head2"><span>Then</span> <span>it</span> <span>spread.</span></div>
  <div class="year" id="year">1455</div>
  <div class="yearlbl" id="yearlbl">PRESSES IN 200+ CITIES BY 1500</div>
  <svg id="map" width="3840" height="1080"><text x="3110" y="640" text-anchor="middle" style="font:italic 600 210px Serif;fill:#6B5A45;fill-opacity:.09;letter-spacing:20px">EUROPA</text><g id="grat"></g><g id="routes"></g><g id="pins"></g></svg>
  <div class="vig" style="width:3840px"></div>
 </div>
</div>
<script>
(function(){
 const tl = gsap.timeline({paused:true});
 const NS='http://www.w3.org/2000/svg';
 const X=lon=>2640+(lon+10)*0.67*44, Y=lat=>48+(59.8-lat)*44;
 // graticule
 const g=document.getElementById('grat');
 for(let lon=-10;lon<=22;lon+=4){const l=document.createElementNS(NS,'line');l.setAttribute('x1',X(lon));l.setAttribute('x2',X(lon));l.setAttribute('y1',Y(60));l.setAttribute('y2',Y(36));l.setAttribute('stroke','#6B5A45');l.setAttribute('stroke-opacity','.25');l.setAttribute('stroke-dasharray','4 8');g.appendChild(l);}
 for(let lat=36;lat<=60;lat+=4){const l=document.createElementNS(NS,'line');l.setAttribute('x1',X(-10));l.setAttribute('x2',X(22));l.setAttribute('y1',Y(lat));l.setAttribute('y2',Y(lat));l.setAttribute('stroke','#6B5A45');l.setAttribute('stroke-opacity','.25');l.setAttribute('stroke-dasharray','4 8');g.appendChild(l);}
 // presses by year (approximate first press per city)
 const C=[['Strasbourg',7.75,48.58,1460],['Bamberg',10.9,49.9,1460],['Cologne',6.96,50.94,1466],['Rome',12.5,41.9,1467],['Basel',7.59,47.56,1468],['Venice',12.33,45.44,1469],['Paris',2.35,48.86,1470],['Nuremberg',11.08,49.45,1470],['Florence',11.25,43.77,1471],['Naples',14.25,40.85,1471],['Utrecht',5.12,52.09,1473],['Lyon',4.84,45.76,1473],['Valencia',-0.38,39.47,1473],['Kraków',19.94,50.06,1473],['Bruges',3.22,51.21,1474],['Lübeck',10.69,53.87,1475],['London',-0.13,51.5,1476],['Seville',-5.98,37.39,1477],['Vienna',16.37,48.2,1482],['Stockholm',18.07,59.33,1483]];
 const LBL=new Set(['Rome','Venice','Paris','London','Kraków','Seville','Stockholm','Cologne']);
 const mx=X(8.27),my=Y(50.0), routes=document.getElementById('routes'), pins=document.getElementById('pins');
 const pin=(x,y,r,fill)=>{const c=document.createElementNS(NS,'circle');c.setAttribute('cx',x);c.setAttribute('cy',y);c.setAttribute('r',r);c.setAttribute('fill',fill);c.setAttribute('stroke','#1E1A16');c.setAttribute('stroke-width','2');pins.appendChild(c);return c;};
 const ring=document.createElementNS(NS,'circle');ring.setAttribute('cx',mx);ring.setAttribute('cy',my);ring.setAttribute('r',14);ring.setAttribute('fill','none');ring.setAttribute('stroke','#B3261E');ring.setAttribute('stroke-width','3');pins.appendChild(ring);
 const mz=pin(mx,my,11,'#B3261E');
 const mzl=document.createElementNS(NS,'text');mzl.setAttribute('x',mx+18);mzl.setAttribute('y',my+30);mzl.setAttribute('class','city big');mzl.textContent='MAINZ';pins.appendChild(mzl);
 gsap.set([mz,mzl,ring],{opacity:0});
 const els=C.map(([n,lo,la,yr],i)=>{
  const x=X(lo),y=Y(la),cx=(mx+x)/2,cy=Math.min(my,y)-60-(i%3)*20;
  const p=document.createElementNS(NS,'path');p.setAttribute('d',`M${mx} ${my} Q${cx} ${cy} ${x} ${y}`);p.setAttribute('stroke','#B3261E');p.setAttribute('stroke-width','2.2');p.setAttribute('fill','none');p.setAttribute('stroke-opacity','.75');routes.appendChild(p);
  const L=p.getTotalLength();gsap.set(p,{strokeDasharray:L,strokeDashoffset:L});
  const d=pin(x,y,6.5,'#1E1A16');gsap.set(d,{opacity:0,scale:0,transformOrigin:'50% 50%'});
  let t=null;if(LBL.has(n)){t=document.createElementNS(NS,'text');const left=(n==='Cologne'||n==='Paris'||n==='London');t.setAttribute('x',left?x-12:x+12);t.setAttribute('text-anchor',left?'end':'start');t.setAttribute('y',n==='Cologne'?y-10:y+6);t.setAttribute('class','city');t.textContent=n.toUpperCase();pins.appendChild(t);gsap.set(t,{opacity:0});}
  return {p,L,d,t,yr};
 });

 // draw paths in the press (measured lengths, explicit fromTo so seeking backwards repaints)
 const draws=[...document.querySelectorAll('.draw')];
 draws.forEach(p=>{const L=p.getTotalLength();p.dataset.len=L;gsap.set(p,{strokeDasharray:L,strokeDashoffset:L});});
 const mk=document.getElementById('markp'),mL=mk.getTotalLength();gsap.set(mk,{strokeDasharray:mL,strokeDashoffset:mL});
 const cn=document.getElementById('connp'),cL=cn.getTotalLength();gsap.set(cn,{strokeDasharray:cL,strokeDashoffset:cL});

 // 0.0-0.6: settle in
 tl.fromTo('#board',{scale:1.04},{scale:1,duration:5,ease:'sine.out'},0);
 // 0.35: stamp slams
 tl.fromTo('#stamp',{opacity:0,scale:2.2,rotation:-14},{opacity:.92,scale:1,rotation:-6,duration:.28,ease:'power4.in'},.35);
 // 0.8: headline words
 tl.fromTo('#head span',{opacity:0,y:40},{opacity:1,y:0,duration:.5,ease:'power3.out',stagger:.22},.8);
 tl.fromTo('#sub',{opacity:0},{opacity:1,duration:.5},1.3);
 // 1.3: press card drops, then the press draws itself
 tl.fromTo('#pressCard',{opacity:0,y:-60,rotation:8},{opacity:1,y:0,rotation:2.5,duration:.45,ease:'back.out(1.4)'},1.3);
 draws.forEach((p,i)=>tl.fromTo(p,{strokeDashoffset:+p.dataset.len},{strokeDashoffset:0,duration:.55,ease:'power1.inOut'},1.75+i*.12));
 // 2.9: the Bible line and counter
 tl.fromTo('#bible',{opacity:0,y:30},{opacity:1,y:0,duration:.5,ease:'power3.out'},2.9);
 const cnt={v:0};tl.fromTo(cnt,{v:0},{v:180,duration:1.2,ease:'power2.out',onUpdate:()=>{document.getElementById('count').textContent=Math.round(cnt.v);}},3.2);
 // 3.6: marker circles "Bible", connector draws, note lands (one beat)
 tl.fromTo(mk,{strokeDashoffset:mL},{strokeDashoffset:0,duration:.6,ease:'power2.inOut'},3.6);
 tl.fromTo(cn,{strokeDashoffset:cL},{strokeDashoffset:0,duration:.35,ease:'power2.out'},4.05);
 tl.fromTo('#note',{opacity:0,y:8},{opacity:1,y:0,duration:.3},4.3);
 // 5.0-5.9: pan to the map
 tl.to('#board',{x:-1920,duration:.9,ease:'power3.inOut'},5.0);
 // 5.7: right headline, Mainz pin
 tl.fromTo('#head2 span',{opacity:0,y:36},{opacity:1,y:0,duration:.45,ease:'power3.out',stagger:.18},5.75);
 tl.fromTo([mz,mzl],{opacity:0},{opacity:1,duration:.3},5.9);
 tl.fromTo(ring,{opacity:.9,attr:{r:12}},{opacity:0,attr:{r:46},duration:1.1,ease:'power1.out',repeat:2},5.9);
 tl.fromTo(['#year','#yearlbl'],{opacity:0},{opacity:1,duration:.35},6.1);
 // 6.3-8.9: routes in year order, the year ticks with them
 els.forEach((e,i)=>{const t0=6.3+i*.12;
  tl.fromTo(e.p,{strokeDashoffset:e.L},{strokeDashoffset:0,duration:.45,ease:'power1.out'},t0);
  tl.fromTo(e.d,{opacity:0,scale:0},{opacity:1,scale:1,duration:.2,ease:'back.out(2)'},t0+.42);
  if(e.t)tl.fromTo(e.t,{opacity:0},{opacity:1,duration:.25},t0+.48);});
 const yr={v:1455};tl.fromTo(yr,{v:1455},{v:1500,duration:2.8,ease:'none',onUpdate:()=>{document.getElementById('year').textContent=Math.round(yr.v);}},6.3);
 // hold, slow push
 tl.to('#board',{scale:1.025,duration:1.4,ease:'sine.inOut'},8.6);
 tl.to({}, {duration:.001}, 9.999);
 window.__timelines = window.__timelines || {}; window.__timelines["main"] = tl; tl.seek(0);
})();
</script>
</body></html>
